<!DOCTYPE html><html lang="zh-Hant-TW"><head><meta charset="UTF-8"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet"><link rel="stylesheet" href="base.css">

<style>
.canvas{width:600px;height:600px;padding:40px;display:grid;grid-template-rows:repeat(3,minmax(0,1fr))}
.row{border-top:1px solid var(--line);display:flex;flex-direction:column;justify-content:center;gap:12px}
.row:first-child{border-top:2px solid var(--text)}
.row:last-child{border-bottom:1px solid var(--text)}
.badge{align-self:flex-start;font-size:30px;font-weight:700;line-height:1.3;padding:8px 18px}
.chip{background:var(--surface2);color:var(--text)}
.tag{border:2px solid var(--text)}
.cond{font-size:20px;line-height:1.5}
</style></head><body><div class="canvas" id="c">
<div class="row"><span class="badge chip">打假先鋒</span><p class="cond">檢舉成立累計 5 次</p></div>
<div class="row"><span class="badge chip">頭號樂迷</span><p class="cond">該藝人頁面有效編輯次數最多者</p></div>
<div class="row"><span class="badge tag">館長</span><p class="cond">站長帳號</p></div>
</div></body></html>
