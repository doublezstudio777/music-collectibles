<!DOCTYPE html><html lang="zh-Hant-TW"><head><meta charset="UTF-8"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet"><link rel="stylesheet" href="base.css">
<style>
.canvas{width:750px;padding:56px 32px 40px}
.panel{position:relative;margin-top:60px}
.panel:first-child{margin-top:0}
.shot{display:block;width:686px;height:auto;border:1px solid var(--line)}
.box{position:absolute;border:3px solid var(--text)}
.badge{position:absolute;width:40px;height:40px;background:var(--orange);color:var(--on-orange);
  font-family:var(--font-mono);font-size:24px;font-weight:500;line-height:40px;text-align:center}
.cap{display:flex;flex-wrap:wrap;gap:8px 28px;margin-top:16px}
.cap span{font-size:28px;font-weight:700;line-height:40px;display:inline-flex;align-items:center;gap:12px;white-space:nowrap}
.cap b{width:40px;height:40px;background:var(--orange);color:var(--on-orange);font-family:var(--font-mono);font-size:24px;font-weight:500;line-height:40px;text-align:center}
</style></head><body><div class="canvas" id="c">
<div class="panel" data-shot="回報_1"><div style="position:relative"><img class="shot" src="shots/回報_1.png" alt="">
<div class="box" style="left:26.7px;top:258.8px;width:240.7px;height:75.3px"></div><div class="badge" style="left:227.3px;top:218.8px">1</div>
</div><p class="cap"><span><b>1</b>對這則收藏有疑問嗎？</span></p></div>
<div class="panel" data-shot="回報_2"><div style="position:relative"><img class="shot" src="shots/回報_2.png" alt="">
<div class="box" style="left:26.7px;top:85.9px;width:634.7px;height:525.6px"></div><div class="badge" style="left:621.3px;top:45.9px">2</div>
<div class="box" style="left:26.7px;top:1189.5px;width:557.3px;height:89.4px"></div><div class="badge" style="left:543.9px;top:1149.5px">3</div>
</div><p class="cap"><span><b>2</b>選原因</span><span><b>3</b>送出</span></p></div>
</div></body></html>
