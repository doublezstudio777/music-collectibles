<!DOCTYPE html><html lang="zh-Hant-TW"><head><meta charset="UTF-8"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet"><link rel="stylesheet" href="base.css">

<style>
.canvas{width:750px;padding:32px}
table{width:100%;border-collapse:collapse;table-layout:fixed}
th{background:var(--surface);border-bottom:1px solid var(--text);font-size:22px;font-weight:700;text-align:left;padding:16px 12px}
td{border-bottom:1px solid var(--line);font-size:24px;padding:16px 12px;vertical-align:middle}
td.n{font-variant-numeric:tabular-nums;font-weight:600}
tr.hl td{background:var(--text);color:#fff;font-weight:700;border-bottom-color:var(--text)}
tr.hl .pill{background:var(--orange);color:var(--on-orange);display:inline;padding:2px 8px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
</style></head><body><div class="canvas" id="c"><table>
<colgroup><col style="width:39%"><col style="width:33%"><col style="width:28%"></colgroup>
<thead><tr><th>項目</th><th>分數</th><th>每日上限</th></tr></thead><tbody>
<tr class="hl"><td>編輯藝人頁、專輯頁</td><td class="n"><span class="pill">+20</span>；<br>單次 200 字以上 <span class="pill">+30</span></td><td>無</td></tr>
<tr><td>新增藝人、專輯、版本</td><td class="n">+15</td><td>無</td></tr>
<tr><td>藝人照片獲採用</td><td class="n">+15</td><td>無</td></tr>
<tr><td>發布收藏</td><td class="n">+10</td><td>5 則</td></tr>
<tr><td>補上空白資料</td><td class="n">+10</td><td>5 次</td></tr>
<tr><td>檢舉成立</td><td class="n">+10</td><td>無</td></tr>
<tr><td>檢舉不成立</td><td class="n">−5</td><td>無</td></tr>
<tr><td>成交</td><td class="n">+5</td><td>無</td></tr>
<tr><td>留言</td><td class="n">+2</td><td>10 則</td></tr>
<tr><td>按讚</td><td class="n">+1</td><td>10 次</td></tr>
<tr><td>收到讚、收到留言</td><td class="n">+1</td><td>每則收藏各 50</td></tr>
</tbody></table></div></body></html>
