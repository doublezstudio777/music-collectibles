<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>籌備中</title>
<meta name="robots" content="noindex">
<style>
  :root{
    --bg:#0d0d10; --ink:#f2f0ec; --dim:#8a8680; --line:#26262b; --accent:#d9c7a3;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg); color:var(--ink);
    font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
    display:flex; align-items:center; justify-content:center;
    padding:2rem; line-height:1.9; -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:34rem}
  .tag{
    font-size:.72rem; letter-spacing:.22em; color:var(--accent);
    text-transform:uppercase; margin-bottom:1.6rem;
  }
  h1{
    font-size:clamp(1.5rem,4.5vw,2.1rem); font-weight:600;
    letter-spacing:.02em; margin-bottom:1.4rem;
  }
  p{color:var(--dim); font-size:.95rem; margin-bottom:1rem}
  p strong{color:var(--ink); font-weight:500}
  .rule{height:1px;background:var(--line);margin:2.2rem 0}
  .foot{font-size:.8rem;color:var(--line);letter-spacing:.05em}
  .foot a{color:var(--dim);text-decoration:none;border-bottom:1px solid var(--line)}
  .foot a:hover{color:var(--accent)}
</style>
</head>
<body>
  <main class="wrap">
    <div class="tag">Coming Soon</div>
    <h1>一張專輯有幾個版本，<br>收藏的人才知道。</h1>
    <p>不同年份、不同壓片廠、不同贊助單位——同一張專輯長得不一樣，就是不一樣。</p>
    <p>這些差異目前沒有任何地方完整收錄，收藏它們的人也沒有地方被看懂。</p>
    <p><strong>我們正在做這件事。</strong></p>
    <div class="rule"></div>
    <p class="foot">籌備中 · <a href="https://stmusictraveler.com">街頭旅歌</a></p>
  </main>
</body>
</html>
